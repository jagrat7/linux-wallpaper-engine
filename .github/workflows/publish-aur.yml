name: Publish AUR package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to publish to AUR
        required: true

permissions:
  contents: read

env:
  AUR_PACKAGE: linux-wallpaper-engine-ux
  AUR_REPO: ssh://aur@aur.archlinux.org/linux-wallpaper-engine-ux.git

jobs:
  publish:
    name: Publish AUR package
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      - name: Install tools
        run: pacman -Sy --noconfirm git openssh pacman-contrib

      - name: Resolve release
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          tag="${RELEASE_TAG}"
          version="${tag#v}"

          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AUR SSH
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          test -n "$AUR_SSH_PRIVATE_KEY"
          install -dm700 "$HOME/.ssh"

          normalized_key="${AUR_SSH_PRIVATE_KEY//$'\r'/}"
          normalized_key="${normalized_key//\\n/$'\n'}"
          printf '%s\n' "$normalized_key" > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          ssh-keygen -y -f "$HOME/.ssh/aur" > /dev/null

          ssh-keyscan -t ed25519,ecdsa,rsa aur.archlinux.org > "$HOME/.ssh/aur_known_hosts"
          ssh-keygen -lf "$HOME/.ssh/aur_known_hosts" | grep -Eq \
            'SHA256:(RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11\+4|uTa/0PndEgPZTf76e1DFqXKJEXKsn7m9ivhLQtzGOCI|5s5cIyReIfNNVGRFdDbe3hdYiI5OelHGpw2rOUud3Q8)'
          mv "$HOME/.ssh/aur_known_hosts" "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"
          ssh-keygen -F aur.archlinux.org -f "$HOME/.ssh/known_hosts"

      - name: Update AUR package
        env:
          GIT_AUTHOR_NAME: jagrat7
          GIT_AUTHOR_EMAIL: actions@github.com
          GIT_COMMITTER_NAME: jagrat7
          GIT_COMMITTER_EMAIL: actions@github.com
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

          git clone "$AUR_REPO" "$AUR_PACKAGE"
          cd "$AUR_PACKAGE"

          sed -i "s/^pkgver=.*/pkgver=$RELEASE_VERSION/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

          updpkgsums
          makepkg --printsrcinfo > .SRCINFO

          if git diff --quiet; then
            echo "AUR package already matches v$RELEASE_VERSION"
            exit 0
          fi

          git add PKGBUILD .SRCINFO
          git commit -m "Release $RELEASE_VERSION"
          git push
