name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

# Push a version tag (vX.Y.Z, matching package.json) to release it: CI checks the
# code, builds and tests every package on its distro, creates the GitHub release,
# then publishes the AUR package. To finish a release that failed partway, run it
# from the Actions tab with the same tag: it uploads only the assets the release is
# missing and never replaces published ones, so their checksums (and the AUR
# PKGBUILD's) stay valid. Tags from before this workflow don't match package.json.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of a release to finish, e.g. v0.5.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  checks:
    name: Version and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  packages:
    name: Build and test packages
    needs: checks
    uses: ./.github/workflows/distro-test.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  release:
    name: GitHub release
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # The exact files the distro tests installed and launched
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: release

      - name: Create the release, or add what it is missing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l release
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" release/* --verify-tag --generate-notes --title "$TAG"
            exit 0
          fi
          # Replacing a published file would change its checksum under the same version
          published="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for file in release/*; do
            if grep -qxF "$(basename "$file")" <<<"$published"; then
              echo "keeping the published $(basename "$file")"
            else
              gh release upload "$TAG" "$file"
            fi
          done

  aur:
    name: AUR package
    needs: release
    uses: ./.github/workflows/publish-aur.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      # The PKGBUILD the distro tests built, not the default branch's
      pkgbuild_ref: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
