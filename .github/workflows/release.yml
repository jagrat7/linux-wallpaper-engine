name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

# Push a version tag (vX.Y.Z, matching package.json) to release it: CI checks the
# code, builds and tests every package on its distro, creates the GitHub release,
# then publishes the AUR package. Run it from the Actions tab with an existing tag
# to rebuild that release; its assets are replaced.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release, e.g. v0.5.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  checks:
    name: Version and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  packages:
    name: Build and test packages
    needs: checks
    uses: ./.github/workflows/distro-test.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  release:
    name: GitHub release
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # The exact files the distro tests installed and launched
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: release

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l release
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --verify-tag --generate-notes --title "$TAG"
          fi

  aur:
    name: AUR package
    needs: release
    uses: ./.github/workflows/publish-aur.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
