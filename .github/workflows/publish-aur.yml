name: Publish AUR package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to publish to AUR
        required: true

permissions:
  contents: read

env:
  AUR_PACKAGE: wallpaperx-bin
  AUR_REPO: ssh://aur@aur.archlinux.org/wallpaperx-bin.git
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  publish:
    name: Publish AUR package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    # Holds AUR_SSH_PRIVATE_KEY; requires approval and only runs from main or v* tags.
    environment: aur

    steps:
      - name: Checkout PKGBUILD
        uses: actions/checkout@v4
        with:
          sparse-checkout: distro/aur
          persist-credentials: false

      - name: Set up environment
        run: |
          pacman -Sy --noconfirm git openssh pacman-contrib
          useradd -m builder

      - name: Configure SSH
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          test -n "$AUR_SSH_PRIVATE_KEY"
          install -dm700 -o builder -g builder /home/builder/.ssh
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY//$'\r'/}" > /home/builder/.ssh/aur
          ssh-keyscan -t ed25519,ecdsa,rsa aur.archlinux.org > /home/builder/.ssh/known_hosts
          ssh-keygen -lf /home/builder/.ssh/known_hosts | grep -Eq \
            'SHA256:(RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11\+4|uTa/0PndEgPZTf76e1DFqXKJEXKsn7m9ivhLQtzGOCI|5s5cIyReIfNNVGRFdDbe3hdYiI5OelHGpw2rOUud3Q8)'
          chown builder:builder /home/builder/.ssh/aur /home/builder/.ssh/known_hosts
          chmod 600 /home/builder/.ssh/aur
          chmod 644 /home/builder/.ssh/known_hosts

      - name: Update AUR package
        run: |
          version="${RELEASE_TAG#v}"
          cp -r "distro/aur/$AUR_PACKAGE" /home/builder/pkg
          chown -R builder:builder /home/builder/pkg
          sudo -u builder -H AUR_REPO="$AUR_REPO" AUR_PACKAGE="$AUR_PACKAGE" VERSION="$version" \
            bash -euo pipefail <<'EOF'
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          export GIT_AUTHOR_NAME=jagrat7 GIT_AUTHOR_EMAIL=actions@github.com
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"

          cd "$HOME"
          git clone "$AUR_REPO" "$AUR_PACKAGE"
          cd "$AUR_PACKAGE"

          # Keep the repo's pkgrel for packaging-only fixes; reset it on a new version.
          published_version="$(sed -n 's/^pkgver=//p' PKGBUILD 2>/dev/null || true)"
          cp -r "$HOME/pkg/." .
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
          if [[ "$published_version" != "$VERSION" ]]; then
            sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          fi
          updpkgsums
          makepkg --printsrcinfo > .SRCINFO

          # Only packaging files; updpkgsums leaves the downloaded sources here too.
          git add PKGBUILD .SRCINFO
          git add -- *.install 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "AUR package already matches v$VERSION"
            exit 0
          fi

          git commit -m "Release $VERSION"
          git push origin HEAD:master
          EOF
