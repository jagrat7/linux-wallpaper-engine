name: Distro tests

# Builds the release packages with electron-builder, then installs and launches each
# one on the distro it targets. The release workflow calls this before publishing.
on:
  pull_request:
    paths:
      - electron-builder.yml
      - package.json
      - bun.lock
      - distro/**
      - scripts/**
      - src/main/main.ts
      - src/main/utils/autostart.ts
      - .github/workflows/distro-test.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build and test, such as a release commit
        type: string
        default: ''
      version:
        description: Version to build as, when it isn't the one in package.json yet
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: distro-test-${{ inputs.ref || github.ref }}
  # A release run must finish; only superseded PR runs are cancelled
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # A release button run builds main as the version it's about to release
      - name: Use the release version
        if: inputs.version != ''
        run: npm pkg set version="$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # electron-builder's .rpm target calls rpmbuild
      - name: Install packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build deb, rpm, zip and AppImage
        run: bun run make

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            release/*.deb
            release/*.rpm
            release/*.zip
            release/*.AppImage
            release/latest-linux.yml
          if-no-files-found: error

  test:
    name: Test on ${{ matrix.distro }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # debian: the .deb, fedora: the .rpm, arch: the AUR PKGBUILD built from the zip,
        # appimage: the .AppImage on Debian 12
        distro: [debian, fedora, arch, appimage]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # A release button run builds main as the version it's about to release
      - name: Use the release version
        if: inputs.version != ''
        run: npm pkg set version="$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: release

      - name: Install playwright-core
        run: dev/verify/lwe setup

      # Ubuntu 24.04 blocks unprivileged user namespaces, which Chromium's sandbox
      # needs inside the test container. Desktop distros allow them.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install, launch and drive the app
        run: bash scripts/ci/distro-smoke.sh ${{ matrix.distro }} release smoke-output

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.distro }}
          path: smoke-output
          if-no-files-found: ignore

  nix:
    name: Nix package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # A release button run builds main as the version it's about to release
      - name: Use the release version
        if: inputs.version != ''
        run: npm pkg set version="$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - uses: cachix/install-nix-action@v31

      # Builds the flake's package (distro/nix/package.nix) with Nixpkgs' Electron
      - name: Build the Nix package
        run: nix build .#default -L

      - name: Check the package contents
        run: |
          test -f result/share/linux-wallpaper-engine/app.asar
          test -d result/share/linux-wallpaper-engine/assets
          test -x result/bin/linux-wallpaper-engine
          ls -l result/bin result/share/linux-wallpaper-engine
